<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PC Build Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="build-container">
        <div class="build-header">
            <h1 class="build-title">AI PC Build Generator</h1>
            <p class="build-subtitle">Let our AI create the perfect build for your budget and needs.</p>
        </div>

        <div class="build-form-card">
            <div class="form-header">
                <h2 class="form-title">Build Configuration</h2>
                <button id="settingsBtn" class="btn-settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </button>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="buildBudget">Budget</label>
                    <div class="input-with-prefix">
                        <span class="input-prefix">$</span>
                        <input type="number" id="buildBudget" placeholder="1000" min="100" max="10000" value="1000">
                    </div>
                </div>
                <div class="form-group">
                    <label for="buildPurpose">Build Purpose</label>
                    <select id="buildPurpose">
                        <option value="gaming">Gaming</option>
                        <option value="productivity">Productivity / Work</option>
                        <option value="streaming">Streaming</option>
                        <option value="video-editing">Video Editing</option>
                        <option value="general">General Use</option>
                        <option value="budget">Budget Build</option>
                        <option value="high-end">High-End Performance</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Components</label>
                <div class="component-checkboxes">
                    <label class="checkbox-label active">
                        <input type="checkbox" id="includeCpu" checked>
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">CPU</span>
                    </label>
                    <label class="checkbox-label active">
                        <input type="checkbox" id="includeMotherboard" checked>
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Motherboard</span>
                    </label>
                    <label class="checkbox-label active">
                        <input type="checkbox" id="includeMemory" checked>
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Memory</span>
                    </label>
                    <label class="checkbox-label active">
                        <input type="checkbox" id="includeStorage" checked>
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Storage</span>
                    </label>
                    <label class="checkbox-label active">
                        <input type="checkbox" id="includeGpu" checked>
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">GPU</span>
                    </label>
                    <label class="checkbox-label active">
                        <input type="checkbox" id="includePsu" checked>
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Power Supply</span>
                    </label>
                    <label class="checkbox-label active">
                        <input type="checkbox" id="includeCase" checked>
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Case</span>
                    </label>
                    <label class="checkbox-label active">
                        <input type="checkbox" id="includeCooler" checked>
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">CPU Cooler</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeMonitor">
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Monitor</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeKeyboard">
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Keyboard</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeMouse">
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Mouse</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeHeadphones">
                        <div class="checkbox-indicator"></div>
                        <span class="checkbox-text">Headphones</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="buildNotes">Additional Notes <span class="label-optional">(Optional)</span></label>
                <textarea id="buildNotes" placeholder="e.g., Prefer AMD over Intel, need WiFi, want RGB..."></textarea>
            </div>

            <button id="generateBuildBtn" class="btn-generate">
                <svg class="btn-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.912 5.813L20 10l-6.088 1.187L12 17l-1.912-5.813L4 10l6.088-1.187L12 3z"/></svg>
                <span>Generate Build</span>
            </button>
        </div>

        <div id="aiBuildLoading" class="ai-build-loading hidden">
            <div class="loading-animation">
                <div class="loading-ring"></div>
                <div class="loading-ring"></div>
                <div class="loading-ring"></div>
            </div>
            <p class="loading-text">Designing your perfect build...</p>
        </div>

        <div id="aiBuildResult" class="ai-build-result hidden">
            <div class="build-summary">
                <div class="build-summary-header">
                    <h3>Your Custom PC Build</h3>
                    <button id="regenerateBtn" class="btn-regenerate">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        Regenerate
                    </button>
                </div>
                <div id="buildContent"></div>
            </div>
        </div>

        <div id="error" class="error hidden">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="errorText"></span>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Brand & Series Preferences</h2>
                <button id="closeSettingsBtn" class="btn-close" aria-label="Close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3>CPU Preferences</h3>
                    <div class="setting-group">
                        <label for="cpuBrand">Brand</label>
                        <select id="cpuBrand">
                            <option value="any">Any</option>
                            <option value="AMD">AMD</option>
                            <option value="Intel">Intel</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="cpuSeries">Series</label>
                        <select id="cpuSeries">
                            <option value="any">Any</option>
                            <optgroup label="AMD">
                                <option value="Ryzen 9">Ryzen 9 (High-end)</option>
                                <option value="Ryzen 7">Ryzen 7 (Performance)</option>
                                <option value="Ryzen 5">Ryzen 5 (Mainstream)</option>
                                <option value="Ryzen 3">Ryzen 3 (Budget)</option>
                            </optgroup>
                            <optgroup label="Intel">
                                <option value="Core i9">Core i9 (High-end)</option>
                                <option value="Core i7">Core i7 (Performance)</option>
                                <option value="Core i5">Core i5 (Mainstream)</option>
                                <option value="Core i3">Core i3 (Budget)</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>GPU Preferences</h3>
                    <div class="setting-group">
                        <label for="gpuBrand">Brand</label>
                        <select id="gpuBrand">
                            <option value="any">Any</option>
                            <option value="NVIDIA">NVIDIA</option>
                            <option value="AMD">AMD</option>
                            <option value="Intel">Intel</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="gpuSeries">Series</label>
                        <select id="gpuSeries">
                            <option value="any">Any</option>
                            <optgroup label="NVIDIA">
                                <option value="RTX 5000">RTX 5000 Series</option>
                                <option value="RTX 4000">RTX 4000 Series</option>
                                <option value="RTX 3000">RTX 3000 Series</option>
                            </optgroup>
                            <optgroup label="AMD">
                                <option value="RX 9000">RX 9000 Series</option>
                                <option value="RX 7000">RX 7000 Series</option>
                                <option value="RX 6000">RX 6000 Series</option>
                            </optgroup>
                            <optgroup label="Intel">
                                <option value="Arc B">Arc B Series</option>
                                <option value="Arc A">Arc A Series</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="gpuAIB">Manufacturer</label>
                        <select id="gpuAIB">
                            <option value="any">Any</option>
                            <option value="ASUS">ASUS</option>
                            <option value="MSI">MSI</option>
                            <option value="Gigabyte">Gigabyte</option>
                            <option value="EVGA">EVGA</option>
                            <option value="Zotac">Zotac</option>
                            <option value="Sapphire">Sapphire</option>
                            <option value="PowerColor">PowerColor</option>
                            <option value="XFX">XFX</option>
                            <option value="PNY">PNY</option>
                            <option value="Gainward">Gainward</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Motherboard</h3>
                    <div class="setting-group">
                        <label for="mbBrand">Brand</label>
                        <select id="mbBrand">
                            <option value="any">Any</option>
                            <option value="ASUS">ASUS</option>
                            <option value="MSI">MSI</option>
                            <option value="Gigabyte">Gigabyte</option>
                            <option value="ASRock">ASRock</option>
                            <option value="NZXT">NZXT</option>
                            <option value="Biostar">Biostar</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Memory</h3>
                    <div class="setting-group">
                        <label for="ramBrand">Brand</label>
                        <select id="ramBrand">
                            <option value="any">Any</option>
                            <option value="Corsair">Corsair</option>
                            <option value="G.Skill">G.Skill</option>
                            <option value="Kingston">Kingston</option>
                            <option value="Crucial">Crucial</option>
                            <option value="Team Group">Team Group</option>
                            <option value="ADATA">ADATA</option>
                            <option value="PNY">PNY</option>
                            <option value="Patriot">Patriot</option>
                            <option value="Silicon Power">Silicon Power</option>
                            <option value="Thermaltake">Thermaltake</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="ramType">Type</label>
                        <select id="ramType">
                            <option value="any">Any</option>
                            <option value="DDR5">DDR5</option>
                            <option value="DDR4">DDR4</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Storage</h3>
                    <div class="setting-group">
                        <label for="storageBrand">Brand</label>
                        <select id="storageBrand">
                            <option value="any">Any</option>
                            <option value="Samsung">Samsung</option>
                            <option value="Western Digital">Western Digital</option>
                            <option value="Seagate">Seagate</option>
                            <option value="Crucial">Crucial</option>
                            <option value="Kingston">Kingston</option>
                            <option value="Sabrent">Sabrent</option>
                            <option value="SK Hynix">SK Hynix</option>
                            <option value="Micron">Micron</option>
                            <option value="ADATA">ADATA</option>
                            <option value="PNY">PNY</option>
                            <option value="Corsair">Corsair</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Other Components</h3>
                    <div class="setting-group">
                        <label for="psuBrand">PSU Brand</label>
                        <select id="psuBrand">
                            <option value="any">Any</option>
                            <option value="Corsair">Corsair</option>
                            <option value="EVGA">EVGA</option>
                            <option value="Seasonic">Seasonic</option>
                            <option value="be quiet!">be quiet!</option>
                            <option value="Thermaltake">Thermaltake</option>
                            <option value="Super Flower">Super Flower</option>
                            <option value="Antec">Antec</option>
                            <option value="Cooler Master">Cooler Master</option>
                            <option value="FSP">FSP</option>
                            <option value="SilverStone">SilverStone</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="caseBrand">Case Brand</label>
                        <select id="caseBrand">
                            <option value="any">Any</option>
                            <option value="NZXT">NZXT</option>
                            <option value="Corsair">Corsair</option>
                            <option value="Lian Li">Lian Li</option>
                            <option value="Fractal Design">Fractal Design</option>
                            <option value="be quiet!">be quiet!</option>
                            <option value="Phanteks">Phanteks</option>
                            <option value="Cooler Master">Cooler Master</option>
                            <option value="Thermaltake">Thermaltake</option>
                            <option value="Deepcool">Deepcool</option>
                            <option value="Montech">Montech</option>
                            <option value="Hyte">Hyte</option>
                            <option value="Antec">Antec</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="coolerBrand">CPU Cooler Brand</label>
                        <select id="coolerBrand">
                            <option value="any">Any</option>
                            <option value="Noctua">Noctua</option>
                            <option value="be quiet!">be quiet!</option>
                            <option value="Corsair">Corsair</option>
                            <option value="Cooler Master">Cooler Master</option>
                            <option value="DeepCool">DeepCool</option>
                            <option value="Arctic">Arctic</option>
                            <option value="Thermalright">Thermalright</option>
                            <option value="NZXT">NZXT</option>
                            <option value="Lian Li">Lian Li</option>
                            <option value="Scythe">Scythe</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Peripherals</h3>
                    <div class="setting-group">
                        <label for="monitorBrand">Monitor Brand</label>
                        <select id="monitorBrand">
                            <option value="any">Any</option>
                            <option value="ASUS">ASUS</option>
                            <option value="Dell">Dell</option>
                            <option value="LG">LG</option>
                            <option value="Samsung">Samsung</option>
                            <option value="AOC">AOC</option>
                            <option value="BenQ">BenQ</option>
                            <option value="ViewSonic">ViewSonic</option>
                            <option value="MSI">MSI</option>
                            <option value="Gigabyte">Gigabyte</option>
                            <option value="Acer">Acer</option>
                            <option value="Alienware">Alienware</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="keyboardBrand">Keyboard Brand</label>
                        <select id="keyboardBrand">
                            <option value="any">Any</option>
                            <option value="Corsair">Corsair</option>
                            <option value="Razer">Razer</option>
                            <option value="Logitech">Logitech</option>
                            <option value="Ducky">Ducky</option>
                            <option value="Keychron">Keychron</option>
                            <option value="SteelSeries">SteelSeries</option>
                            <option value="HyperX">HyperX</option>
                            <option value="Leopold">Leopold</option>
                            <option value="Varmilo">Varmilo</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="mouseBrand">Mouse Brand</label>
                        <select id="mouseBrand">
                            <option value="any">Any</option>
                            <option value="Logitech">Logitech</option>
                            <option value="Razer">Razer</option>
                            <option value="SteelSeries">SteelSeries</option>
                            <option value="Zowie">Zowie</option>
                            <option value="Corsair">Corsair</option>
                            <option value="Roccat">Roccat</option>
                            <option value="HyperX">HyperX</option>
                            <option value="Pulsar">Pulsar</option>
                            <option value="Glorious">Glorious</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="headphoneBrand">Headphone Brand</label>
                        <select id="headphoneBrand">
                            <option value="any">Any</option>
                            <option value="HyperX">HyperX</option>
                            <option value="SteelSeries">SteelSeries</option>
                            <option value="Razer">Razer</option>
                            <option value="Logitech">Logitech</option>
                            <option value="Sennheiser">Sennheiser</option>
                            <option value="Audio-Technica">Audio-Technica</option>
                            <option value="Beyerdynamic">Beyerdynamic</option>
                            <option value="Corsair">Corsair</option>
                            <option value="Astro">Astro</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="resetSettingsBtn" class="btn-secondary">Reset All</button>
                <button id="saveSettingsBtn" class="btn-primary">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
